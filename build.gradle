import groovy.json.JsonSlurper

// 1. 恢复原厂的 JSON 变量读取逻辑，保证所有模块的 versions 变量恢复正常！
def versionFile = file('project-versions.json')
def json = new JsonSlurper().parseText(versionFile.text)
ext.versions = json

buildscript {
    ext.kotlin_version = '1.4.10'
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/public' } 
        maven { url "https://jitpack.io" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.jakewharton.butterknife-gradle-plugin:10.2.1'
        classpath 'org.codehaus.groovy:groovy-json:3.0.6'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url "https://jitpack.io" }
    }
}

// 2. 彻底移除我们之前加的 subprojects 强控（因为它会打乱原本的变量结构），让一切回归原厂！
task clean(type: Delete) {
    delete rootProject.buildDir
}
