name: Android CI

on:
  push:
    branches: [ "5.7.9" ]
  workflow_dispatch:

jobs:
  build:
    # 🌟 用稳定且存在的 22.04 服务器！
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 👑 终极物理扫荡 + 拔网线：用通配符把 34、35 甚至以后的 SDK 全灭了，再禁止联网！
    - name: Nuke Future SDKs & Disable Cloud Download
      run: |
        rm -rf $ANDROID_HOME/platforms/android-3[4-9]*
        rm -rf $ANDROID_HOME/build-tools/3[4-9]*
        rm -rf $ANDROID_HOME/system-images/android-3[4-9]*
        echo "" >> gradle.properties
        echo "android.builder.sdkDownload=false" >> gradle.properties

    - name: Build with Gradle
      run: ./gradlew :app:assembleRelease --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AutoX-v5.7.9-Release-APK
        path: app/build/outputs/apk/release/*.apk
