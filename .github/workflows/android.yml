name: Android CI

on:
  push:
    branches: [ "5.7.9" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Pre-install Exact SDKs
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-29" "build-tools;29.0.2" "build-tools;29.0.3" "platforms;android-30" "build-tools;30.0.3"

    - name: Nuke Future SDKs & Disable Cloud Download
      run: |
        rm -rf $ANDROID_HOME/platforms/android-3[1-9]*
        rm -rf $ANDROID_HOME/build-tools/3[1-9]*
        rm -rf $ANDROID_HOME/system-images/*
        echo "" >> gradle.properties
        echo "android.builder.sdkDownload=false" >> gradle.properties

    # 👑 终极镜像矩阵：加入阿里专属 JCenter 遗迹库 + 华为云全量快照库！
    - name: Inject God Mode Substitution Strategy
      run: |
        cat <<EOF > init.gradle
        allprojects {
            repositories {
                // 🚨 核心救命稻草：阿里云专为 JCenter 关停保留的绝版快照库！
                maven { url 'https://maven.aliyun.com/repository/jcenter' }
                // 🚨 备用神库：华为云的超级 Maven 备份节点
                maven { url 'https://repo.huaweicloud.com/repository/maven/' }
                
                // 常规的现代公共库
                maven { url 'https://mirrors.tencent.com/nexus/repository/maven-public/' }
                maven { url 'https://maven.aliyun.com/repository/public' }
                maven { url 'https://maven.aliyun.com/repository/google' }
                maven { url 'https://jitpack.io' }
                mavenCentral()
                google()
            }
            configurations.all {
                resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                    if (details.requested.group == 'com.github.Stericson' && details.requested.name == 'RootShell') {
                        details.useVersion '89c3b49401'
                    }
                    if (details.requested.group == 'com.github.Stericson' && details.requested.name == 'RootTools') {
                        details.useVersion '10fd55fb6d'
                    }
                }
            }
        }
        EOF

    - name: Build with Gradle
      run: ./gradlew --init-script init.gradle :app:assembleRelease -x lint -x lintVitalDevRelease -x lintVitalMarketRelease -x lintVitalCommonRelease --no-daemon --refresh-dependencies

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AutoX-v5.7.9-Release-APK
        path: app/build/outputs/apk/release/*.apk
