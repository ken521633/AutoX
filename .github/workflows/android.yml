name: Android CI

on:
  push:
    branches: [ "5.7.9" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 👑 对症下药 1：精确补齐它死活要找的 29.0.2 版本
    - name: Pre-install Exact SDKs
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-29" "build-tools;29.0.2" "build-tools;29.0.3" "platforms;android-30" "build-tools;30.0.3"

    # 👑 对症下药 2：扩大扫荡范围！把 31 到 39 的所有未来版本全删了，彻底干掉 base-extension 报错！
    - name: Nuke Future SDKs & Disable Cloud Download
      run: |
        rm -rf $ANDROID_HOME/platforms/android-3[1-9]*
        rm -rf $ANDROID_HOME/build-tools/3[1-9]*
        rm -rf $ANDROID_HOME/system-images/*
        echo "" >> gradle.properties
        echo "android.builder.sdkDownload=false" >> gradle.properties

    # 注入全局仓库脚本，专治国内镜像拦截和 404
    - name: Inject God Mode Repositories
      run: |
        cat <<EOF > init.gradle
        allprojects {
            repositories {
                maven { url 'https://jitpack.io' }
                maven { url 'https://jcenter.bintray.com' }
                google()
                mavenCentral()
            }
        }
        EOF

    # 挂载脚本，跳过一切无用扫描，直接合成 Release 正式包！
    - name: Build with Gradle
      run: ./gradlew --init-script init.gradle :app:assembleRelease -x lint -x lintVitalDevRelease -x lintVitalMarketRelease -x lintVitalCommonRelease --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AutoX-v5.7.9-Release-APK
        path: app/build/outputs/apk/release/*.apk
