name: Android CI

on:
  push:
    branches: [ "5.7.9" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 乖乖拉取你自己的 GitHub 仓库代码（带上所有子模块）
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    # 2. 配置 Java 11 环境
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    # 3. 赋予执行权限
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. 👑 终极杀招：编译前全盘扫描清洗（天王老子来了也不会因为写错变量报错了）
    - name: Force Clean All Toxic Configs
      run: |
        # 1. 全局搜索并强行删掉那个恶心的 120.25 死 IP
        find . -name "build.gradle" -exec sed -i 's/http:\/\/120\.25\.164\.233:8081.*//g' {} +
        # 2. 全局搜索并强行修正 butterknife 那个多敲了点号的 :10.2.1:.
        find . -name "build.gradle" -exec sed -i 's/:10\.2\.1:\./:10.2.1/g' {} +
        # 3. 确保包含国内公共 jcenter 镜像，防止找不到老旧依赖
        sed -i 's/google()/google()\n        mavenCentral()\n        maven { url "https:\/\/maven.aliyun.com\/repository\/public" }/g' build.gradle || true

    # 5. 执行标准打包打包！
    - name: Build with Gradle
      run: ./gradlew :app:assembleRelease --no-daemon

    # 6. 把胜利的果实提取出来
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AutoX-v5.7.9-Release-APK
        path: app/build/outputs/apk/release/*.apk
