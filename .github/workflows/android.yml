name: Android CI

on:
  push:
    branches: [ "5.7.9" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 🌟 核心绝杀：直接让 GitHub 去克隆官方 wilinz 纯净、无污染的 5.7.9 分支源码！
    # 彻底绕过你现在这个仓库里被改烂的、带双冒号的垃圾配置文件！
    - name: Clone Official Pure AutoXjs 5.7.9
      run: |
        git clone --branch 5.7.9 https://github.com/wilinz/AutoXjs.git .
        
    # 2. 配置标准 Java 环境
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    # 3. 赋予执行权限
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. 彻底移除官方源码里可能残留的阿里云镜像，全部走云端光速官方源
    - name: Clean Repositories Config
      run: |
        sed -i 's/maven.*aliyun.*/ /g' build.gradle
        sed -i 's/maven.*120.25.*/ /g' build.gradle

    # 5. 执行官方标准无错打包
    - name: Build with Gradle
      run: ./gradlew :app:assembleRelease --no-daemon

    # 6. 提取并上传最终编译出来的 5.7.9 绿色版 APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AutoX-v5.7.9-Official-Pure-Release
        path: app/build/outputs/apk/release/*.apk
