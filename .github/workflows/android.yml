name: Android CI

on:
  push:
    branches: [ "5.7.9" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 👑 关键新增：用绝对路径唤醒 sdkmanager，提前把目标 SDK 29 塞进本地！
    - name: Pre-install SDK 29
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-29" "build-tools;29.0.3"

    # 物理扫荡未来版本 SDK + 强行断网，杜绝一切解析崩溃
    - name: Nuke Future SDKs & Disable Cloud Download
      run: |
        rm -rf $ANDROID_HOME/platforms/android-3[4-9]*
        rm -rf $ANDROID_HOME/build-tools/3[4-9]*
        rm -rf $ANDROID_HOME/system-images/android-3[4-9]*
        echo "" >> gradle.properties
        echo "android.builder.sdkDownload=false" >> gradle.properties

    # 注入上帝级全局脚本，强行指定官方仓库，防拦截
    - name: Inject God Mode Repositories
      run: |
        cat <<EOF > init.gradle
        allprojects {
            repositories {
                maven { url 'https://jitpack.io' }
                maven { url 'https://jcenter.bintray.com' }
                google()
                mavenCentral()
            }
        }
        EOF

    # 挂载上帝脚本，精准屏蔽掉所有渠道的 Lint 扫描，一针见血去打包！
    - name: Build with Gradle
      run: ./gradlew --init-script init.gradle :app:assembleRelease -x lint -x lintVitalDevRelease -x lintVitalMarketRelease -x lintVitalCommonRelease --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AutoX-v5.7.9-Release-APK
        path: app/build/outputs/apk/release/*.apk
