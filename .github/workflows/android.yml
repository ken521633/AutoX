name: Android CI

on:
  push:
    branches: [ "5.7.9" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Pre-install Exact SDKs
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-29" "build-tools;29.0.2" "build-tools;29.0.3" "platforms;android-30" "build-tools;30.0.3"

    - name: Nuke Future SDKs & Disable Cloud Download
      run: |
        rm -rf $ANDROID_HOME/platforms/android-3[1-9]*
        rm -rf $ANDROID_HOME/build-tools/3[1-9]*
        rm -rf $ANDROID_HOME/system-images/*
        echo "" >> gradle.properties
        echo "android.builder.sdkDownload=false" >> gradle.properties

    # 👑 摸金校尉：注入 Jenkins 和 Mulesoft 的企业级遗迹仓库，强制打捞 JCenter 的绝版老包！
    - name: Inject God Mode Repositories
      run: |
        cat <<EOF > init.gradle
        allprojects {
            buildscript {
                repositories {
                    maven { url 'https://repo.jenkins-ci.org/public/' }
                    maven { url 'https://repository.mulesoft.org/nexus/content/repositories/public/' }
                    maven { url 'https://jitpack.io' }
                    mavenCentral()
                    google()
                }
            }
            repositories {
                maven { url 'https://repo.jenkins-ci.org/public/' }
                maven { url 'https://repository.mulesoft.org/nexus/content/repositories/public/' }
                maven { url 'https://jitpack.io' }
                mavenCentral()
                google()
            }
        }
        EOF

    - name: Build with Gradle
      run: ./gradlew --init-script init.gradle :app:assembleRelease -x lint -x lintVitalDevRelease -x lintVitalMarketRelease -x lintVitalCommonRelease --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AutoX-v5.7.9-Release-APK
        path: app/build/outputs/apk/release/*.apk
