name: Android CI

on:
  push:
    branches: [ "5.7.9" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 👑 绝杀一：强行删掉服务器上太新的 SDK，防止老版本 Gradle 触发 35x 强转崩溃
    - name: Remove Android 35 SDKs to fix NumberFormatException
      run: |
        rm -rf $ANDROID_HOME/platforms/android-35
        rm -rf $ANDROID_HOME/build-tools/35.*
        rm -rf $ANDROID_HOME/system-images/android-35
        rm -rf $ANDROID_HOME/system-images/android-34

    # 👑 绝杀二：加上 -x 参数，强行跳过所有 Lint 扫描任务，直奔打包！
    - name: Build with Gradle
      run: ./gradlew :app:assembleRelease -x lint -x lintVitalRelease -x lintVitalDevRelease --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AutoX-v5.7.9-Release-APK
        path: app/build/outputs/apk/release/*.apk
