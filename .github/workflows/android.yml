name: Android CI

on:
  push:
    branches: [ "5.7.9" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Pre-install Exact SDKs
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-29" "build-tools;29.0.2" "build-tools;29.0.3" "platforms;android-30" "build-tools;30.0.3"

    - name: Nuke Future SDKs & Disable Cloud Download
      run: |
        rm -rf $ANDROID_HOME/platforms/android-3[1-9]*
        rm -rf $ANDROID_HOME/build-tools/3[1-9]*
        rm -rf $ANDROID_HOME/system-images/*
        echo "" >> gradle.properties
        echo "android.builder.sdkDownload=false" >> gradle.properties

    - name: Rescue Extinct Dependencies (Fake Local Maven Repo)
      run: |
        mkdir -p local_repo/com/github/Stericson/RootShell/1.6/
        curl -L -s -o local_repo/com/github/Stericson/RootShell/1.6/RootShell-1.6.aar https://github.com/Stericson/RootShell/releases/download/1.6/RootShell.aar
        cat <<EOF > local_repo/com/github/Stericson/RootShell/1.6/RootShell-1.6.pom
        <project>
          <modelVersion>4.0.0</modelVersion>
          <groupId>com.github.Stericson</groupId>
          <artifactId>RootShell</artifactId>
          <version>1.6</version>
          <packaging>aar</packaging>
        </project>
        EOF
        
        mkdir -p local_repo/com/github/Stericson/RootTools/5.0/
        curl -L -s -o local_repo/com/github/Stericson/RootTools/5.0/RootTools-5.0.aar https://github.com/Stericson/RootTools/releases/download/5.0/RootTools.aar
        cat <<EOF > local_repo/com/github/Stericson/RootTools/5.0/RootTools-5.0.pom
        <project>
          <modelVersion>4.0.0</modelVersion>
          <groupId>com.github.Stericson</groupId>
          <artifactId>RootTools</artifactId>
          <version>5.0</version>
          <packaging>aar</packaging>
        </project>
        EOF

    # 👑 重新排兵布阵：稳库顶上，宕机库垫底！
    - name: Inject God Mode Repositories
      run: |
        cat <<EOF > init.gradle
        allprojects {
            repositories {
                // 1. 我们捏造的绝版避难所永远第一
                maven { url uri("\$(pwd)/local_repo") }
                
                // 2. 官方绝对稳定、绝对不会 502 的大库放前面！让 Glide 从这里秒下！
                google()
                mavenCentral()
                maven { url 'https://jitpack.io' }
                
                // 3. 常规国内镜像放中间
                maven { url 'https://mirrors.tencent.com/nexus/repository/maven-public/' }
                maven { url 'https://maven.aliyun.com/repository/public' }
                maven { url 'https://maven.aliyun.com/repository/google' }
                maven { url 'https://repo.huaweicloud.com/repository/maven/' }
                
                // 4. 🚨 容易 502 抽风的阿里云 JCenter 遗迹库扔到最后！只让它处理走投无路的包！
                maven { url 'https://maven.aliyun.com/repository/jcenter' }
            }
        }
        EOF

    - name: Build with Gradle
      run: ./gradlew --init-script init.gradle :app:assembleRelease -x lint -x lintVitalDevRelease -x lintVitalMarketRelease -x lintVitalCommonRelease --no-daemon --refresh-dependencies

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AutoX-v5.7.9-Release-APK
        path: app/build/outputs/apk/release/*.apk
