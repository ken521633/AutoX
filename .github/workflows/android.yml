name: Android CI

on:
  push:
    branches: [ "5.7.9" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 👑 终极拔网线大法：提前下好依赖，严禁老古董去云端扫盲！
    - name: Pre-install SDK 29 & Disable Gradle Cloud Download
      run: |
        # 1. 用新版命令行工具提前下好 SDK 29 和 30（新版工具认识 35x，绝对不崩）
        yes | sdkmanager "platforms;android-29" "build-tools;29.0.3" "platforms;android-30" "build-tools;30.0.3"
        # 2. 强行给项目喂一颗定心丸：禁止自动下载 SDK，闭上眼睛直接打包！
        echo "android.builder.sdkDownload=false" >> gradle.properties

    - name: Build with Gradle
      run: ./gradlew :app:assembleRelease --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AutoX-v5.7.9-Release-APK
        path: app/build/outputs/apk/release/*.apk
